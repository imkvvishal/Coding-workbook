<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Train Ticket Booking</title>

</head>
<body>
 <h2>Train Ticket Reservation System</h2>
 <form action="ticket1" method="get">
 <table>
 <tr>
 <td><b>Passenger Name :</b></td>
 <td><input type="text" name="name"></td>
 </tr>
 <tr>
 <td><b>Age :</b></td>
 <td><input type="number" name="age"></td>
 </tr>
 <tr>
 <td><b>Gender :</b></td>
 <td>
 <input type="radio" name="gender" value="Male"> Male
 <input type="radio" name="gender" value="Female"> Female
 </td>
 </tr>
 <tr>
 <td><b>Email :</b></td>
 <td><input type="email" name="email"></td>
 </tr>
 <tr>
 <td><b>Phone Number :</b></td>
 <td><input type="tel" name="phone_number"></td>
 </tr>
 <tr>
 <td><b>Date of Journey :</b></td>
 <td><input type="date" name="dateof"></td>
 </tr>
 <tr>
 <td><b>Select Train :</b></td>
 <td>
 <select name="trainname">
 <option value="">Select Train</option>
 <option value="Vaigai Express">Vaigai Express</option>
 <option value="Vande Bharat">Vande Bharat</option>
 <option value="Chennai Express">Chennai Express</option>
 <option value="Pandian Express">Pandian Express</option>
 </select>
 </td>
 </tr>
 <tr>
 <td><b>Select the Coach :</b></td>
 <td>
 <input type="radio" name="option2" value="Sleeper"> Sleeper
 </td>
 </tr>
 <tr>
 <td></td>
 <td>
 <input type="radio" name="option2" value="AC Coach"> AC Coach
 </td>
 </tr>
 <tr>
 <td></td>
 <td>
 <input type="radio" name="option2" value="Special Coach"> Special
Coach
 </td>
 </tr>
 <tr>
 <td></td>
 <td>
 <input type="radio" name="option2" value="General Coach"> General
Coach
 </td>
 </tr>
 <tr>
 <td>
 <button type="submit">Submit</button>
 </td>
 <td>
 <button type="reset">Cancel</button>
 </td>
 </tr>
 </table>
 </form>
</body>
</html>
